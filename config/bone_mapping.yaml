# Anatomical bone mapping — external config, no hardcoded meshes in Python.
# Mesh files live under assets/bones/ (auto-installed on first use).
# Joint names match config/skeleton_definition.yaml.
#
# Mesh convention: unit length along +Z (0→1), cross-section in XY.
# rest_rotation / rest_translation correct authoring orientation before placement.

schema_version: "1.0.0"
pack_version: "1.0.0"
default_material: clinical
default_radial_scale: 18.0
show_joints: true

bones:
  LPelvisHip:
    mesh: pelvis_hip.obj
    start_joint: Pelvis
    end_joint: LHip
    rest_rotation: [0, 0, 0]
    rest_translation: [0, 0, 0]
    scale: 1.0
    visibility: true
    material: clinical

  RPelvisHip:
    mesh: pelvis_hip.obj
    start_joint: Pelvis
    end_joint: RHip
    rest_rotation: [0, 0, 0]
