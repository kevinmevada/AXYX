[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axyx"
version = "0.1.0"
description = "AXYX — clinical gait motion research platform (Motion Engine + Studio)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AXYX Contributors" }]
keywords = [
  "biomechanics",
  "gait",
  "motion-capture",
  "visualization",
  "research",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "h5py>=3.10",
  "scikit-learn>=1.4",
  "Pillow>=10.0",
  "fonttools>=4.40",
]

[project.optional-dependencies]
studio = [
  "PySide6>=6.6",
  "pyqtgraph>=0.13",
  "pyvista>=0.43",
  "pyvistaqt>=0.11",
  "vtk>=9.3",
  "opencv-python>=4.8",
  "torch>=2.2",
]

[project.scripts]
axyx = "motion_engine.studio.app:run_studio"

[project.entry-points."axyx.studio_plugins"]
sample_console = "motion_engine.studio.plugins.sample_console_plugin:SampleConsolePlugin"

[project.urls]
Repository = "https://github.com/axyx/axyx"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
